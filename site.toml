[site]
name = "academo"
url = "https://leg10n-webcraft-academo.vercel.app"
original_url = "https://academo.org/"
description = "Academo educational demo site with category pages and sixteen functional interactive demos including US States Map Flashcards and Capital Cities Map."
category = "replication"

[site.tech]
stack = ["Vite", "TypeScript", "Three.js", "MathJax", "Canvas", "Web Audio"]
hosting = "Vercel"
hosting_access_granted = true

[site.assets]
images = [
  "public/assets/demos/19-tet-keyboard.png",
  "public/assets/demos/amplitude-modulation.png",
  "public/assets/demos/rot-13-cipher.png",
