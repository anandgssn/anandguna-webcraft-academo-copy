  "public/assets/logic-symbols/xor.svg",
]

[site.prd]
file = "PRD.md"
setup = "npm install && npm run dev"
backend = "Static Academo frontend with client-side routing and DOM filtering; no backend required."

[[screenshots]]
route = "/"
file = "screenshots/replica-home.png"
device = "desktop"
side = "replica"

