  "public/assets/demos/hypocycloid.png",
  "public/assets/demos/estimating-pi-monte-carlo.png",
  "public/assets/demos/azimuth-calculator.png",
  "public/assets/demos/azimuth-altitude.svg",
  "public/assets/demos/colour-temperature-relationship.png",
  "public/assets/demos/electric-field-line-simulator.png",
  "public/assets/demos/simple-pendulum.png",
  "public/assets/demos/geodesics.png",
  "public/assets/demos/capital-cities-map.png",
  "public/assets/demos/us-states-map.png",
  "public/assets/us-states/",
